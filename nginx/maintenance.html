<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CVE Radar — Temporarily Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #a3a3a3;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      max-width: 440px;
      width: 100%;
      text-align: center;
    }

    .icon-wrap {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: #1a1a1a;
      border: 1px solid #262626;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .icon-wrap svg {
      width: 28px;
      height: 28px;
      color: #525252;
    }

    .brand {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #525252;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #e5e5e5;
      line-height: 1.3;
      margin-bottom: 0.75rem;
    }

    p {
      font-size: 0.9375rem;
      line-height: 1.6;
      color: #737373;
      margin-bottom: 1.5rem;
    }

    .divider {
      height: 1px;
      background: #1f1f1f;
      margin: 1.5rem 0;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8125rem;
      color: #525252;
      justify-content: center;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #737373;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .footer {
      margin-top: 2.5rem;
      font-size: 0.75rem;
      color: #404040;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M20.25 6.375c0 2.278-3.694 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.694-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125V6.375m16.5 5.625c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125" />
      </svg>
    </div>

    <div class="brand">CVE Radar</div>
    <h1>Temporarily Offline</h1>
    <p>
      The database is currently unreachable.<br>
      We'll be back online shortly.
    </p>

    <div class="divider"></div>

    <div class="status-row">
      <div class="dot"></div>
      Reconnecting…
    </div>

    <div class="footer">
      Try refreshing in a few minutes.
    </div>
  </div>
</body>
</html>
